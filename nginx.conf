server {
    listen 8080;
    server_name _;

    # Don't advertise the nginx version in Server: headers / error pages.
    server_tokens off;

    # Static site: no uploads, so reject any request body up front.
    client_max_body_size 1k;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for every response (including errors).
    # `always` keeps them on non-200 replies too. CSP is deliberately
    # omitted: the demo page uses an inline <style>, so a strict policy
    # would break it; revisit if the page moves to external assets.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Liveness probe: tiny 200 response, no disk access.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}